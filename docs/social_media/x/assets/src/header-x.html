<!doctype html>
<!--
  Sebenza X (Twitter) profile header, 1500x500 (3:1).
  The avatar circle overlaps the BOTTOM-LEFT of the header on profile
  pages, so the lockup sits centred and slightly high; the lower-left
  quadrant stays quiet.
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf8f0; --green-deep: #003d1f; --green-soft: #0a8c50;
    --gold: #c98214; --gold-bright: #f5a623; --red: #de3831;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    background: var(--green-deep); color: var(--paper);
    overflow: hidden;
  }
  .bgchev { position: absolute; right: -120px; top: -160px; width: 760px; height: 760px; opacity: 0.06; }
  .bgchev svg { width: 100%; height: 100%; }
  .card {
    width: 100vw; height: 100vh; position: relative;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center;
    padding-bottom: 56px;
  }
  .lockup { display: flex; align-items: center; gap: 26px; }
  .mark { width: 96px; height: 86px; }
  .mark svg { width: 100%; height: 100%; display: block; }
  .wordmark {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: 108px; letter-spacing: -0.015em; line-height: 1;
    font-variation-settings: "opsz" 144;
  }
  .tagline {
    margin-top: 26px; font-weight: 700; font-size: 22px;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--gold-bright);
  }
  .stripe {
    display: flex; height: 12px; width: 100vw;
    position: absolute; left: 0; bottom: 0;
    border-top: 1px solid rgba(251, 248, 240, 0.25);
  }
  .stripe .g { flex: 3; background: var(--green-soft); }
  .stripe .a { flex: 2; background: var(--gold); }
  .stripe .r { flex: 1; background: var(--red); }
</style>
</head>
<body>
  <div class="bgchev">
    <svg viewBox="0 0 600 600">
      <path d="M 60 60 L 360 300 L 60 540 Z" fill="#fbf8f0" />
      <path d="M 180 200 L 360 300 L 180 400 L 260 300 Z" fill="#f5a623" />
    </svg>
  </div>
  <div class="card">
    <div class="lockup">
      <span class="mark" data-mark></span>
      <span class="wordmark">Sebenza</span>
    </div>
    <div class="tagline">South Africa&rsquo;s National Talent Platform</div>
    <div class="stripe"><div class="g"></div><div class="a"></div><div class="r"></div></div>
  </div>
</body>
</html>
