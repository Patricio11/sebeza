<!doctype html>
<!--
  Sebenza social LIST card (1080x1350): tip cards and short lists.
  Same house language as quote.html; the body is a numbered (or dotted)
  list of up to five items. Themes via body class: theme-light | theme-dark.
  Slots filled by render.mjs: [data-slot=eyebrow], [data-slot=headline],
  [data-slot=items] (li elements injected), [data-slot=sub] (footnote),
  [data-mark]. Marker style via body class marker-number | marker-dot.
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf8f0; --ink: #14110d; --ink-soft: #5a5249;
    --green: #006b3c; --green-deep: #003d1f; --green-soft: #0a8c50;
    --gold: #c98214; --gold-bright: #f5a623; --red: #de3831; --hairline: #e4ded4;
    --headline-size: 84px; --item-size: 36px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { font-family: "Hanken Grotesk", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  .card { width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 96px 96px 0; position: relative; }
  .toprule { height: 8px; width: 148px; background: var(--green); margin-bottom: 40px; }
  .eyebrow { font-weight: 700; font-size: 27px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-soft); }
  /* Headline, list and footnote sit together in the middle of the card,
     the way quote.html centres its body, so a three-item tip never leaves
     a cold half-page above the footer. */
  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 96px; }
  .headline {
    font-family: "Fraunces", Georgia, serif; font-weight: 560; font-size: var(--headline-size);
    line-height: 1.06; letter-spacing: -0.015em; max-width: 900px;
    font-variation-settings: "opsz" 144;
  }
  .headline em { font-style: italic; color: var(--gold); font-weight: 540; }
  .list { margin-top: 64px; display: flex; flex-direction: column; gap: 40px; list-style: none; }
  .item { display: flex; align-items: flex-start; gap: 28px; }
  .num {
    flex: none; width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: var(--paper);
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 30px;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
    font-variation-settings: "opsz" 144;
  }
  .marker-dot .num { width: 22px; height: 22px; border-radius: 4px; background: var(--gold); margin: 16px 19px 0; font-size: 0; }
  .item p { font-size: var(--item-size); line-height: 1.32; color: var(--ink); }
  .item p strong { font-weight: 700; }
  .item p span { color: var(--ink-soft); }
  .sub {
    margin-top: 48px; font-size: 30px; line-height: 1.4; color: var(--ink-soft); max-width: 860px;
    border-top: 2px solid var(--ink); padding-top: 26px;
  }
  .sub:empty { display: none; }
  .footer { display: flex; align-items: center; gap: 22px; padding-bottom: 58px; }
  .footer .mark { width: 52px; height: 47px; display: block; }
  .footer .mark svg { width: 100%; height: 100%; display: block; }
  .wordmark { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 44px; color: var(--green-deep); letter-spacing: -0.01em; }
  .site { font-size: 27px; color: var(--ink-soft); font-weight: 500; letter-spacing: 0.02em; margin-left: auto; }
  .stripe { display: flex; height: 18px; width: 100vw; position: absolute; left: 0; bottom: 0; }
  .stripe .g { flex: 3; background: var(--green); }
  .stripe .a { flex: 2; background: var(--gold); }
  .stripe .r { flex: 1; background: var(--red); }

  body.theme-dark { background: var(--green-deep); color: var(--paper); }
  body.theme-dark .toprule { background: var(--gold); }
  body.theme-dark .eyebrow { color: rgba(251, 248, 240, 0.62); }
  body.theme-dark .headline em { color: var(--gold-bright); }
  body.theme-dark .num { background: var(--paper); color: var(--green-deep); }
  body.theme-dark.marker-dot .num { background: var(--gold-bright); }
  body.theme-dark .item p { color: var(--paper); }
  body.theme-dark .item p span { color: rgba(251, 248, 240, 0.72); }
  body.theme-dark .sub { color: rgba(251, 248, 240, 0.78); border-top-color: rgba(251, 248, 240, 0.35); }
  body.theme-dark .wordmark { color: var(--paper); }
  body.theme-dark .site { color: rgba(251, 248, 240, 0.62); }
  body.theme-dark .stripe { border-top: 1px solid rgba(251, 248, 240, 0.25); }
  body.theme-dark .stripe .g { background: var(--green-soft); }
</style>
</head>
<body class="theme-light marker-number">
  <div class="card">
    <div class="toprule"></div>
    <div class="eyebrow" data-slot="eyebrow"></div>
    <div class="body">
      <div class="headline" data-slot="headline"></div>
      <ol class="list" data-slot="items"></ol>
      <div class="sub" data-slot="sub"></div>
    </div>
    <div class="footer">
      <span class="mark" data-mark></span>
      <span class="wordmark">Sebenza</span>
      <span class="site">sebenzasa.com</span>
    </div>
    <div class="stripe"><div class="g"></div><div class="a"></div><div class="r"></div></div>
  </div>
</body>
</html>
