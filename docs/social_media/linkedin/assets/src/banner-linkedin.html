<!doctype html>
<!--
  Sebenza LinkedIn company-page banner, 2256x382 (LinkedIn's recommended
  upload; displays around 1128x191). Very thin: one horizontal lockup row,
  centred slightly right because the square company logo sits at the
  page's left edge below the banner on desktop and overlaps the lower-left
  on mobile.
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf8f0; --green-deep: #003d1f; --green-soft: #0a8c50;
    --gold: #c98214; --gold-bright: #f5a623; --red: #de3831;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    background: var(--green-deep); color: var(--paper);
    overflow: hidden;
  }
  .bgchev { position: absolute; right: -220px; top: -220px; width: 780px; height: 780px; opacity: 0.06; }
  .bgchev svg { width: 100%; height: 100%; }
  .card {
    width: 100vw; height: 100vh; position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: 44px; padding-left: 140px; padding-bottom: 14px;
  }
  .mark { width: 118px; height: 106px; }
  .mark svg { width: 100%; height: 100%; display: block; }
  .wordmark {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: 132px; letter-spacing: -0.015em; line-height: 1;
    font-variation-settings: "opsz" 144;
  }
  .divider { width: 2px; height: 120px; background: rgba(251, 248, 240, 0.28); }
  .tagline {
    font-weight: 700; font-size: 27px; line-height: 1.9;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold-bright); max-width: 560px;
  }
  .stripe {
    display: flex; height: 10px; width: 100vw;
    position: absolute; left: 0; bottom: 0;
    border-top: 1px solid rgba(251, 248, 240, 0.25);
  }
  .stripe .g { flex: 3; background: var(--green-soft); }
  .stripe .a { flex: 2; background: var(--gold); }
  .stripe .r { flex: 1; background: var(--red); }
</style>
</head>
<body>
  <div class="bgchev">
    <svg viewBox="0 0 600 600">
      <path d="M 60 60 L 360 300 L 60 540 Z" fill="#fbf8f0" />
      <path d="M 180 200 L 360 300 L 180 400 L 260 300 Z" fill="#f5a623" />
    </svg>
  </div>
  <div class="card">
    <span class="mark" data-mark></span>
    <span class="wordmark">Sebenza</span>
    <span class="divider"></span>
    <span class="tagline">South Africa&rsquo;s National<br />Talent Platform</span>
    <div class="stripe"><div class="g"></div><div class="a"></div><div class="r"></div></div>
  </div>
</body>
</html>
