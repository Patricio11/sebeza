<!doctype html>
<!-- V6 · "One CV in a pile of 400" · 19s text-driven story. 1080x1920.
     Stacked full-screen scenes; each fades in/out on its own delay once
     body.play is set. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf8f0; --green-deep: #003d1f; --green-soft: #0a8c50;
    --gold: #c98214; --gold-bright: #f5a623; --red: #de3831;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { font-family: "Fraunces", Georgia, serif; background: var(--green-deep); color: var(--paper); overflow: hidden; }
  .scene {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 0 100px; opacity: 0;
  }
  .scene .line {
    font-weight: 560; font-size: 108px; line-height: 1.12;
    letter-spacing: -0.015em; font-variation-settings: "opsz" 144;
  }
  .scene .line em { font-style: italic; color: var(--gold-bright); }
  .scene .small { font-family: "Hanken Grotesk", sans-serif; font-weight: 500; font-size: 30px; color: rgba(251,248,240,0.62); margin-top: 48px; }
  .stripe { display: flex; height: 20px; width: 100vw; position: absolute; left: 0; bottom: 0; z-index: 5; border-top: 1px solid rgba(251, 248, 240, 0.25); }
  .stripe .g { flex: 3; background: var(--green-soft); }
  .stripe .a { flex: 2; background: var(--gold); }
  .stripe .r { flex: 1; background: var(--red); }

  @keyframes hold { 0% { opacity: 0; transform: translateY(20px); } 8% { opacity: 1; transform: translateY(0); } 88% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes holdEnd { 0% { opacity: 0; transform: translateY(20px); } 12% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; } }
  /* The hook is on screen from frame one (pre-play included); it only fades OUT. */
  @keyframes hookOut { 0% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }

  .s1 { opacity: 1; }
  body.play .s1 { animation: hookOut 3.4s ease 0s forwards; }
  body.play .s2 { animation: hold 2.7s ease 3.5s forwards; }
  body.play .s3 { animation: hold 2.7s ease 6.3s forwards; }
  /* one-second dark beat between 9.0s and 10.0s: nothing on screen */
  body.play .s4 { animation: hold 2.7s ease 10.0s forwards; }
  body.play .s5 { animation: hold 2.4s ease 12.8s forwards; }
  body.play .s6 { animation: hold 2.6s ease 15.3s forwards; }
  body.play .s7 { animation: holdEnd 1.2s ease 18.0s forwards; }
</style>
</head>
<body>
  <div class="scene s1"><div class="line">POV: your CV is number <em>347</em> in the pile.</div></div>
  <div class="scene s2"><div class="line">You spent hours on it.</div></div>
  <div class="scene s3"><div class="line">It was never opened.</div></div>
  <div class="scene s4"><div class="line">So we <em>flipped</em> it.</div></div>
  <div class="scene s5"><div class="line">Employers search.</div></div>
  <div class="scene s6"><div class="line"><em>You</em> get found.</div></div>
  <div class="scene s7">
    <div class="line" style="font-size:132px">Sebenza</div>
    <div class="small">sebenzasa.com</div>
  </div>
  <div class="stripe"><div class="g"></div><div class="a"></div><div class="r"></div></div>
</body>
</html>
