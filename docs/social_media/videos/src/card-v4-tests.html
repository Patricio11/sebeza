<!doctype html>
<!-- V4 · "The boring work" · ~17s. 1080x1920. A real vitest unit run
     (file names and counts captured verbatim from an actual run on
     2026-08-17: 23 files, 275 tests) replayed in a branded terminal.
     Honesty rule: every line below is genuine output data, not set
     dressing. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf8f0; --green-deep: #003d1f; --green-soft: #0a8c50;
    --gold: #c98214; --gold-bright: #f5a623; --red: #de3831; --term: #101b13;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { font-family: "Fraunces", Georgia, serif; background: var(--green-deep); color: var(--paper); overflow: hidden; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; opacity: 0; }
  .line { font-weight: 560; font-size: 104px; line-height: 1.12; letter-spacing: -0.015em; font-variation-settings: "opsz" 144; }
  .line em { font-style: italic; color: var(--gold-bright); }
  .small { font-family: "Hanken Grotesk", sans-serif; font-weight: 500; font-size: 30px; color: rgba(251,248,240,0.62); margin-top: 48px; }
  .stripe { display: flex; height: 20px; width: 100vw; position: absolute; left: 0; bottom: 0; z-index: 9; border-top: 1px solid rgba(251,248,240,0.25); }
  .stripe .g { flex: 3; background: var(--green-soft); }
  .stripe .a { flex: 2; background: var(--gold); }
  .stripe .r { flex: 1; background: var(--red); }

  /* Terminal scene */
  .term-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 56px; opacity: 0; }
  .term {
    width: 100%; max-width: 968px; border-radius: 20px; background: var(--term);
    border: 1px solid rgba(251,248,240,0.14); overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.4);
  }
  .term-bar { display: flex; align-items: center; gap: 10px; padding: 18px 22px; background: rgba(251,248,240,0.06); }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .term-title { margin-left: 12px; font-family: "JetBrains Mono", monospace; font-size: 20px; color: rgba(251,248,240,0.5); }
  .term-body { padding: 26px 28px 30px; font-family: "JetBrains Mono", monospace; font-size: 22.5px; line-height: 1.72; text-align: left; }
  .trow { opacity: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(251,248,240,0.82); }
  .trow .ck { color: #35c96f; font-weight: 600; }
  .trow .n { color: rgba(251,248,240,0.45); }
  .cmd { color: var(--gold-bright); }
  .sumrow { opacity: 0; margin-top: 18px; font-weight: 600; font-size: 26px; }
  .sumrow .k { color: rgba(251,248,240,0.55); }
  .sumrow .v { color: #35c96f; }
  .term-cap { opacity: 0; margin-top: 40px; font-family: "Hanken Grotesk", sans-serif; font-size: 34px; color: rgba(251,248,240,0.85); text-align: center; }
  .term-cap em { font-family: "Fraunces", serif; font-style: italic; color: var(--gold-bright); }

  @keyframes hookOut { 0% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes holdEnd { 0% { opacity: 0; transform: translateY(20px); } 14% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; } }

  .s1 { opacity: 1; }
  body.play .s1 { animation: hookOut 2.9s ease 0s forwards; }
  body.play .term-wrap { animation: fadeIn 0.7s ease 2.9s forwards; }
  /* 24 rows stagger in from 3.4s, ~0.32s apart */
  body.play .trow { animation: rowIn 0.3s ease forwards; }
  body.play .sumrow { animation: rowIn 0.5s ease forwards; }
  body.play .term-cap { animation: fadeIn 0.8s ease 12.6s forwards; }
  body.play .s3 { animation: holdEnd 1.4s ease 14.9s forwards; }
</style>
</head>
<body>
  <div class="scene s1"><div class="line">The <em>boring work</em> that keeps your data safe.</div></div>

  <div class="term-wrap">
    <div class="term">
      <div class="term-bar">
        <span class="dot" style="background:#de3831"></span>
        <span class="dot" style="background:#f5a623"></span>
        <span class="dot" style="background:#35c96f"></span>
        <span class="term-title">sebenza · vitest</span>
      </div>
      <div class="term-body" id="tbody"></div>
    </div>
    <div class="term-cap">Every change, tested. <em>Boring on purpose.</em></div>
  </div>

  <div class="scene s3">
    <div class="line" style="font-size:132px">Sebenza</div>
    <div class="small">sebenzasa.com</div>
  </div>

  <div class="stripe"><div class="g"></div><div class="a"></div><div class="r"></div></div>

  <script>
    // REAL output of `vitest run --project unit`, 2026-08-17.
    const FILES = [
      ["lib/env-guard.test.ts", 5], ["lib/status.test.ts", 20],
      ["lib/analytics/csv.test.ts", 17], ["lib/analytics/justification.test.ts", 11],
      ["lib/analytics/suppress.test.ts", 11], ["lib/auth/id-validation.test.ts", 22],
      ["lib/auth/invite-tokens.test.ts", 6], ["lib/consent/index.test.ts", 9],
      ["lib/crypto/index.test.ts", 13], ["lib/employer/vacancies-display.test.ts", 12],
      ["lib/i18n/catalogs.test.ts", 12], ["lib/llm/coach-safety.test.ts", 15],
      ["lib/mock/completeness.test.ts", 3], ["lib/nav/safe-internal-path.test.ts", 13],
      ["lib/notifications/catalog.test.ts", 47], ["lib/security/server-action-guards.test.ts", 3],
      ["lib/rate-limit/memory.test.ts", 9], ["lib/seeker/free-alternatives.test.ts", 4],
      ["lib/seeker/vacancy-outcome.test.ts", 8], ["lib/skills/prereq-graph.test.ts", 8],
      ["lib/taxonomy/countries.test.ts", 12], ["lib/vacancy/public.test.ts", 3],
      ["lib/email/templates/welcome.test.ts", 12],
    ];
    const tbody = document.getElementById("tbody");
    const mk = (html, cls, delay) => {
      const d = document.createElement("div");
      d.className = cls;
      d.innerHTML = html;
      d.style.animationDelay = delay + "s";
      tbody.appendChild(d);
    };
    mk('<span class="cmd">$ npm run test</span>', "trow", 3.4);
    FILES.forEach(([f, n], i) => {
      mk('<span class="ck">✓</span> ' + f + ' <span class="n">(' + n + " tests)</span>", "trow", 3.75 + i * 0.32);
    });
    mk('<span class="k">Test Files</span>  <span class="v">23 passed</span> <span class="n">(23)</span>', "sumrow", 11.5);
    mk('<span class="k">Tests</span>       <span class="v">275 passed</span> <span class="n">(275)</span>', "sumrow", 11.9);
  </script>
</body>
</html>
