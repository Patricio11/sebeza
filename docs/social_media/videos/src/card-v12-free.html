<!doctype html>
<!-- V12 · "Free means free" · 15s. 1080x1920. Light scenes, then the dark
     promise end-card. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf8f0; --ink: #14110d; --ink-soft: #5a5249;
    --green: #006b3c; --green-deep: #003d1f; --green-soft: #0a8c50;
    --gold: #c98214; --gold-bright: #f5a623; --red: #de3831;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { font-family: "Fraunces", Georgia, serif; background: var(--paper); overflow: hidden; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 100px; opacity: 0; }
  .light { color: var(--ink); }
  .dark { background: var(--green-deep); color: var(--paper); }
  .line { font-weight: 560; font-size: 100px; line-height: 1.12; letter-spacing: -0.015em; font-variation-settings: "opsz" 144; }
  .dark .line em { font-style: italic; color: var(--gold-bright); }
  .r0 { font-weight: 620; font-size: 460px; line-height: 1; color: var(--green); opacity: 0; transform: scale(2.4); }
  .facts { margin-top: 70px; display: flex; flex-direction: column; gap: 34px; }
  .facts div { font-family: "Hanken Grotesk", sans-serif; font-weight: 600; font-size: 46px; color: var(--ink-soft); opacity: 0; }
  .small { font-family: "Hanken Grotesk", sans-serif; font-weight: 500; font-size: 30px; color: rgba(251,248,240,0.62); margin-top: 48px; }
  .stripe { display: flex; height: 20px; width: 100vw; position: absolute; left: 0; bottom: 0; z-index: 5; }
  .stripe .g { flex: 3; background: var(--green); }
  .stripe .a { flex: 2; background: var(--gold); }
  .stripe .r { flex: 1; background: var(--red); }
  .dark .stripe { border-top: 1px solid rgba(251,248,240,0.25); }
  .dark .stripe .g { background: var(--green-soft); }

  @keyframes hold { 0% { opacity: 0; transform: translateY(20px); } 10% { opacity: 1; transform: translateY(0); } 88% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes holdEnd { 0% { opacity: 0; } 14% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes slam { 0% { opacity: 0; transform: scale(2.4); } 55% { opacity: 1; transform: scale(0.96); } 75% { transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  @keyframes hold2 { 0% { opacity: 0; } 5% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
  /* The hook is on screen from frame one; it only fades OUT. */
  @keyframes hookOut { 0% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
  .s1 { opacity: 1; }
  body.play .s1 { animation: hookOut 3.0s ease 0s forwards; }
  body.play .s2 { animation: hold2 7.2s ease 3.1s forwards; }
  body.play .r0 { animation: slam 0.9s cubic-bezier(0.22, 1, 0.36, 1) 3.5s forwards; }
  body.play .f1 { animation: fadeUp 0.6s ease 5.2s forwards; }
  body.play .f2 { animation: fadeUp 0.6s ease 6.6s forwards; }
  body.play .f3 { animation: fadeUp 0.6s ease 8.0s forwards; }
  body.play .s3 { animation: holdEnd 1.4s ease 10.4s forwards; }
</style>
</head>
<body>
  <div class="scene light s1"><div class="line">What Sebenza costs a job-seeker:</div></div>
  <div class="scene light s2">
    <div class="r0">R0</div>
    <div class="facts">
      <div class="f1">No fees.</div>
      <div class="f2">No paying to be seen.</div>
      <div class="f3">Not now. Not ever.</div>
    </div>
  </div>
  <div class="scene dark s3">
    <div class="line">Free for job-seekers. <em>Always.</em></div>
    <div class="small">Sebenza &middot; sebenzasa.com</div>
    <div class="stripe"><div class="g"></div><div class="a"></div><div class="r"></div></div>
  </div>
  <div class="stripe" style="z-index:1"><div class="g"></div><div class="a"></div><div class="r"></div></div>
</body>
</html>
